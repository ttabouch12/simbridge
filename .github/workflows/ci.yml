name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-tests:
    # The JVM modules need no native pjsua2 build; the APK is built and signed locally for releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sip:test :gateway:test

  phone-apk:
    # The phone app needs no native code, so CI can compile both flavors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :phone:assembleFullDebug :phone:assembleFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: simbridge-phone-debug
          path: phone/build/outputs/apk/**/*.apk
